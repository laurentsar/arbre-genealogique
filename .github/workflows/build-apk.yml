name: Build & Release Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install JS deps
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web assets (www)
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Version Android (versionName + versionCode) dérivée de package.json :
      # versionCode monotone (x*10000+y*100+z) pour que les updates soient reconnues.
      - name: Stamp Android version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$VERSION"
          VCODE=$((10#$MA*10000 + 10#$MI*100 + 10#$PA))
          sed -i "s/versionCode 1$/versionCode $VCODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "versionName=$VERSION versionCode=$VCODE"

      # Clé STABLE : les mises à jour s'installent par-dessus (fini le conflit de
      # signature). Si les secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD
      # sont configurés, on restaure le vrai keystore de release ; sinon
      # build.gradle retombe automatiquement sur le debug.keystore committé
      # (voir signingConfigs.stable) pour que le build marche sans configuration.
      - name: Restore signing keystore (si configuré)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/signing.p12
            echo "Keystore de release restauré."
          else
            echo "Pas de secret keystore → build.gradle retombe sur debug.keystore."
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: cp android/app/build/outputs/apk/release/app-release.apk "arbre-genealogique-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbre-genealogique-apk
          path: arbre-genealogique-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="arbre-genealogique-${{ steps.version.outputs.version }}.apk"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$APK" --clobber
          else
            gh release create "v${VERSION}" "$APK" --title "Arbre Généalogique v${VERSION}" --notes "Build automatique v${VERSION}"
          fi
          gh release edit "v${VERSION}" --draft=false

# build signé via keystore stable (secrets ANDROID_KEYSTORE_B64 / _PASSWORD)
